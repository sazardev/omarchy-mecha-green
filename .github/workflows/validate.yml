name: Validate

on:
  push:
  pull_request:

jobs:
  shell-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/mecha-status
          bash -n scripts/ping-status
          bash -n scripts/fetch-halo-backgrounds.sh
          bash -n scripts/mecha-themetize
          bash -n scripts/mecha-livewall
          bash -n scripts/mecha-live-next
          bash -n scripts/make-live-set.sh
          bash -n scripts/render-wallpapers.sh
          bash -n scripts/render-system-assets.sh
          python3 -m py_compile proposals/backgrounds/generate-live.py
          bash -n system/install-login.sh
          bash -n system/uninstall-login.sh
      - name: JSON manifests
        run: |
          for f in plugins/*/manifest.json; do
            jq empty "$f"
          done
      - name: Theme sanity
        run: |
          for t in themes/mecha-green themes/mecha-green-light; do
            test -f "$t/colors.toml"
            test -f "$t/shell.toml"
            test -f "$t/preview.png"
            test "$(find "$t/backgrounds" -maxdepth 1 -type f | wc -l)" -eq 13
            if [[ $t == *light ]]; then
              test -f "$t/backgrounds/0-topographic-light.webp"
              for name in drift fold field terrain panorama undulate; do
                test -f "$t/backgrounds/100-${name}-light.webp"
                test -f "$t/backgrounds/100-${name}-light.mp4"
              done
            else
              test -f "$t/backgrounds/0-topographic.webp"
              for name in drift fold field terrain panorama undulate; do
                test -f "$t/backgrounds/100-${name}.webp"
                test -f "$t/backgrounds/100-${name}.mp4"
              done
            fi
          done
          grep -q 'mode = "dark"' themes/mecha-green/colors.toml
          grep -q 'mode = "light"' themes/mecha-green-light/colors.toml
      - name: Flat wallpaper sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sources = sorted(Path('assets/svg').glob('*.svg'))
          assert [p.name for p in sources] == ['topo-dark.svg', 'topo-light.svg']
          sources += sorted(Path('proposals/backgrounds/svg').glob('*.svg'))
          assert len(sources) == 14
          sources.append(Path('system/sddm/mecha-green/background.svg'))
          for path in sources:
              root = ET.parse(path).getroot()
              assert root.attrib['width'] == '2560'
              assert root.attrib['height'] == '1440'
              text = path.read_text().lower()
              for forbidden in ('gradient', '<filter', 'gaussianblur', 'drop-shadow'):
                  assert forbidden not in text, f'{forbidden} found in {path}'
          PY
      - name: Live wallpaper assets
        run: |
          for f in hud-dark.png hud-light.png scanlines-dark.png scanlines-light.png \
                   rain-dark.png rain-light.png fog-dark.webp fog-light.webp \
                   glow-dark.png glow-light.png sweep-dark.png sweep-light.png; do
            test -f "assets/live/$f"
          done
      - name: Login and boot theme files
        run: |
          test -f system/sddm/mecha-green/Main.qml
          test -f system/sddm/mecha-green/background.svg
          test -f system/sddm/mecha-green/background.webp
          test -f system/plymouth/mecha-green/mecha-green.plymouth
          test -f system/plymouth/mecha-green/background.png
          test -f system/plymouth/mecha-green/mecha-green.script
          test -f system/plymouth/mecha-green/progress_bar.png
