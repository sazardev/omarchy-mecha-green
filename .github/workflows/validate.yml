name: Validate

on:
  push:
  pull_request:

jobs:
  shell-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/mecha-status
          bash -n scripts/ping-status
          bash -n scripts/fetch-halo-backgrounds.sh
          bash -n scripts/mecha-themetize
          bash -n scripts/mecha-livewall
          bash -n scripts/mecha-live-next
          bash -n scripts/make-live-set.sh
          bash -n system/install-login.sh
          bash -n system/uninstall-login.sh
      - name: JSON manifests
        run: |
          for f in plugins/*/manifest.json; do
            jq empty "$f"
          done
      - name: Theme sanity
        run: |
          for t in themes/mecha-green themes/mecha-green-light; do
            test -f "$t/colors.toml"
            test -f "$t/shell.toml"
            test -f "$t/preview.png"
            if [[ $t == *light ]]; then
              test -f "$t/backgrounds/8-mecha-helmet-light.webp"
            else
              test -f "$t/backgrounds/8-mecha-helmet.webp"
            fi
            test -f "$t/backgrounds/live-helmet.mp4"
            test -f "$t/backgrounds/live-radar.mp4"
          done
          grep -q 'mode = "dark"' themes/mecha-green/colors.toml
          grep -q 'mode = "light"' themes/mecha-green-light/colors.toml
      - name: Live wallpaper assets
        run: |
          for f in hud-dark.png hud-light.png scanlines-dark.png scanlines-light.png \
                   rain-dark.png rain-light.png fog-dark.webp fog-light.webp \
                   glow-dark.png glow-light.png sweep-dark.png sweep-light.png; do
            test -f "assets/live/$f"
          done
      - name: Login and boot theme files
        run: |
          test -f system/sddm/mecha-green/Main.qml
          test -f system/sddm/mecha-green/background.webp
          test -f system/plymouth/mecha-green/mecha-green.plymouth
          test -f system/plymouth/mecha-green/mecha-green.script
          test -f system/plymouth/mecha-green/progress_bar.png
